<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Permite que a aplicação se adapte a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuthFlow - Login</title>

    <!-- Arquivo responsável pelos estilos da aplicação -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <h1>AuthFlow</h1>

            <p class="subtitle">
                Entre na sua conta
            </p>

            <!--
                Formulário de login.

                O JavaScript vai capturar o evento "submit"
                e verificar as credenciais do usuário.
            -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <!--
                        Local onde será exibida uma mensagem
                        específica sobre o e-mail.
                    -->
                    <small
                        class="error"
                        id="emailError"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        required
                    >

                    <!-- Mensagem de erro relacionada à senha -->
                    <small
                        class="error"
                        id="passwordError"
                    ></small>

                </div>


                <!--
                    Mensagem geral do formulário.

                    Exemplo:
                    "E-mail ou senha incorretos."
                -->
                <p id="formMessage"></p>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p class="auth-link">

                Ainda não possui uma conta?

                <a href="register.html">
                    Criar conta
                </a>

            </p>

        </section>

    </main>


    <!--
        Carrega o JavaScript responsável
        pelo funcionamento do login.
    -->
    <script src="js/login.js"></script>

</body>

</html>
